name: Daily price update

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST every day
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scrape.mjs
      - name: Commit new prices and history
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/products.json data/history.json
          git diff --staged --quiet || git commit -m "Prices for $(date -u +%F)"
          git push
      # The push above triggers an automatic rebuild on Vercel / Cloudflare Pages
      # when the repo is connected to either, so no extra deploy step is needed.
